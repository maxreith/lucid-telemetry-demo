name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust

  replay-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Install sbt
        run: |
          curl -fsSL https://github.com/sbt/sbt/releases/download/v1.10.7/sbt-1.10.7.tgz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sbt/bin" >> "$GITHUB_PATH"
      - name: Replay recorded events through Scala and Rust, compare outputs
        run: tools/replay.sh
